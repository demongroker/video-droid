plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-kapt'
}

android {
    namespace 'com.xerxes.videodroid'
    compileSdk 36

    defaultConfig {
        applicationId "com.xerxes.videodroid"
        minSdk 24
        targetSdk 36
        versionCode 63
        versionName "1.9.5"
        ndk {
            abiFilters "arm64-v8a"
        }
        buildConfigField "String", "UPDATER_URL",
            "\"https://api.github.com/repos/demongroker/video-droid/releases/latest\""
    }

    signingConfigs {
        release {
            // Only wire up signing when the keystore is actually present.
            // CI measures an UNSIGNED release APK for size validation; tag
            // builds provide the real keystore via secrets.
            def ksFile = rootProject.file("videodroid.keystore")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword project.findProperty("RELEASE_STORE_PASSWORD")
                    ?: System.getenv("RELEASE_STORE_PASSWORD") ?: "debug"
                keyAlias "videodroid"
                keyPassword project.findProperty("RELEASE_KEY_PASSWORD")
                    ?: System.getenv("RELEASE_KEY_PASSWORD") ?: "debug"
            }
        }
    }
    buildTypes {
        release {
            // Shrink the ~61 MB APK: R8 tree-shaking + resource shrinking.
            // Keep rules for Chaquopy and ffmpeg-kit live in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            // Leave unsigned when no keystore is configured (CI size check).
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    packagingOptions {
        resources {
            excludes += "/META-INF/*.kotlin_module"
        }
    }
}

// Chaquopy 16.1 on-device default is 3.8; yt-dlp 2026.7.4 needs >=3.10.
chaquopy {
    defaultConfig {
        version "3.12"
        // Build-host Python. Left unset so Chaquopy auto-detects python3.12
        // from PATH (works on CI and any dev box). Override locally with
        // -PchaquopyBuildPython=/path/to/python3.12 if needed.
        def buildPy = project.findProperty("chaquopyBuildPython")
        if (buildPy) {
            buildPython buildPy
        }
        pip {
            // Chaquopy's pip index stops at 2024.10.22; pin the wheel URL.
            install "https://files.pythonhosted.org/packages/69/b2/8cd1613f56eed7ceb64fbd4df3f1c01246bfb098e6f398228bafda22b80b/yt_dlp-2026.8.19-py3-none-any.whl"
        }
    }
}

dependencies {
    // Core AndroidX
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Jetpack Compose BOM - compatible with Kotlin 1.9.24
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material3:material3-window-size-class'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.compose.runtime:runtime-livedata'
    // runtime-saved-instance-state may not be in this BOM version

    // Coroutines & Flow
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // Media3 ExoPlayer
    def media3_version = "1.3.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"

    // WorkManager
    def work_version = "2.10.0"
    implementation "androidx.work:work-runtime-ktx:$work_version"
    testImplementation 'junit:junit:4.13.2'

    // Room Database for DownloadQueue
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // Dagger Hilt
    implementation 'com.google.dagger:hilt-android:2.50'
    kapt 'com.google.dagger:hilt-compiler:2.50'
    implementation 'androidx.hilt:hilt-navigation-compose:1.1.0'

    // Navigation Compose
    def nav_version = "2.7.6"
    implementation "androidx.navigation:navigation-compose:$nav_version"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // FFmpeg
    implementation 'io.github.maitrungduc1410:ffmpeg-kit-video:7.1.5'

    // Coil for images
    implementation 'io.coil-kt:coil-compose:2.4.0'

    // Serialization
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0'
}