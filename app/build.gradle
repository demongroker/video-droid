plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.xerxes.videodroid'
    compileSdk 34

    defaultConfig {
        applicationId "com.xerxes.videodroid"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
        python {
            buildPython "/home/adnan/.local/share/uv/python/cpython-3.11.15-linux-x86_64-gnu/bin/python3.11"
            pip {
                install "yt-dlp"
            }
        }
    }

    signingConfigs {
        release {
            storeFile file("../videodroid.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias "videodroid"
            keyPassword RELEASE_KEY_PASSWORD
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'io.github.maitrungduc1410:ffmpeg-kit-full:7.1.5'
}
