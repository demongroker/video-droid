plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.xerxes.videodroid'
    compileSdk 34

    defaultConfig {
        applicationId "com.xerxes.videodroid"
        minSdk 24
        targetSdk 34
        versionCode 44
        versionName "1.6.17"
        ndk {
            abiFilters "arm64-v8a"
        }
        buildConfigField "String", "UPDATER_URL",
            "\"https://api.github.com/repos/demongroker/video-droid/releases/latest\""
    }

    signingConfigs {
        release {
            storeFile file("../videodroid.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias "videodroid"
            keyPassword RELEASE_KEY_PASSWORD
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

// Chaquopy 16.1 on-device default is 3.8; yt-dlp 2026.7.4 needs >=3.10.
chaquopy {
    defaultConfig {
        version "3.12"
        buildPython "/home/adnan/.local/share/uv/python/cpython-3.12.8-linux-x86_64-gnu/bin/python3.12"
        pip {
            // Chaquopy's pip index stops at 2024.10.22; pin the wheel URL.
            install "https://files.pythonhosted.org/packages/f9/8a/cd4c9b02c10c563adfe78118310129641900e1cd6de888cfae2452072696/yt_dlp-2026.7.4-py3-none-any.whl"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'io.github.maitrungduc1410:ffmpeg-kit-full:7.1.5'
}
