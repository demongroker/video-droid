plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
    id 'org.jetbrains.kotlin.android'
}

// Version catalog consumption confirmed via libs.versions.toml
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'com.chaquo.python' version '16.1.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}

android {
    namespace 'com.xerxes.videodroid'
    compileSdk 34

    defaultConfig {
        applicationId "com.xerxes.videodroid"
        minSdk 24
        targetSdk 34
        versionCode 55
        versionName "1.6.28"
        ndk {
            abiFilters "arm64-v8a"
        }
        buildConfigField "String", "UPDATER_URL",
            "\"https://api.github.com/repos/demongroker/video-droid/releases/latest\""
        // Support VIDEODROID_BUILD_PYTHON env var; fallback to python3.12 or python3 from PATH
        buildConfigField "String", "BUILD_PYTHON",
            "\"${System.getenv().get('VIDEOODROID_BUILD_PYTHON') ?: 'python3.12'}\""
    }

    signingConfigs {
        release {
            storeFile file("../videodroid.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias "videodroid"
            keyPassword RELEASE_KEY_PASSWORD
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

// Chaquopy 16.1 on-device default is 3.8; yt-dlp 2026.7.4 needs >=3.10.
chaquopy {
    defaultConfig {
        version "3.12"
        // Use env var or fallback; Chaquopy accepts absolute path or 'python3.12' in PATH
        buildPython "${System.getenv().get('VIDEOODROID_BUILD_PYTHON') ?: 'python3.12'}"
        pip {
            // Chaquopy's pip index stops at 2024.10.22; pin the wheel URL.
            install "https://files.pythonhosted.org/packages/f9/8a/cd4c9b02c10c563adfe78118310129641900e1cd6de888cfae2452072696/yt_dlp-2026.7.4-py3-none-any.whl"
        }
    }
}

// --- DEPENDENCY LOCKING ENABLED ---
// Lock all configurations so dependency resolution is reproducible
dependencyLocking {
    lockAllConfigurations()
}

// Version catalog (libs.versions.toml) is consumed below.
// The Android plugin uses these versions at build time.
dependencies {
    // androidX cores
    implementation(libs.androidx.core.core_ktx)
    implementation(libs.androidx.appcompat.appcompat)
    implementation(libs.google.material.material)
    implementation(libs.androidx.constraintlayout.constraintlayout)
    // FFmpeg
    implementation(libs.ffmpeg_kit_full)
    // Room
    implementation(libs.room_ktx)
    kapt(libs.room_compiler)
    // Coroutines
    implementation(libs.coroutines_android)
    // OkHttp
    implementation(libs.okhttp)
}
