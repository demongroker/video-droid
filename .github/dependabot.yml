# Any change to this file makes Dependabot re-evaluate immediately instead of
# waiting for its weekly slot — used on 17 Nov 2026 to bring the coil and
# compose-bom updates back after their PRs were closed (the branches are gone
# once a Dependabot PR closes).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
