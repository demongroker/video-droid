name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 || true

      - name: Set up Android SDK
        uses: reactivecirculus/-android-sdk@v1
        with:
          api-levels: "34"
          build-tools: "34.0.0"
          platform-tools: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build assemnbleDebug
        env:
          VIDEODROID_BUILD_PYTHON: python3.12
        run: ./gradlew assembleDebug --no-daemon

      - name: Run tests
        env:
          VIDEODROID_BUILD_PYTHON: python3.12
        run: ./gradlew test --no-daemon
