name: CI

# Fast feedback for every branch: compile, unit tests, a debug APK, and the test
# reports when something breaks. Deliberately does NOT sign, tag or publish —
# releases are owned by release.yml on v* tags only.

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Handles the Gradle build cache and the dependency cache in one step.
      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # The ubuntu-latest image already ships the Android SDK; assert it exists
      # rather than pulling actions/setup-android (it fails on 'tools').
      - name: Verify Android SDK is available
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      # Chaquopy compiles the Python helper at build time and needs a real 3.12.
      - name: Set up Python (Chaquopy build host)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace
          ls -l app/build/outputs/apk/debug/

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          retention-days: 14
          if-no-files-found: warn

      - name: Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: videodroid-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: warn
