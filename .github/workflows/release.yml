name: Build & Release

# CI OWNS RELEASES (single path).
#
# A v* tag builds the release APK with R8, signs it with the release keystore
# from GitHub Secrets, asserts the signing certificate fingerprint, then publishes
# the APK and its .sha256 asset. Nothing is uploaded by hand any more, so a
# release always corresponds to a tag and there can never be two different
# binaries for one version.
#
# The in-app updater refuses an APK signed with another certificate, so the
# fingerprint check below is a hard gate, not a report.

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Read-only by default; only the release job escalates.
permissions:
  contents: read

env:
  # The only certificate the in-app updater will accept.
  EXPECTED_CERT_SHA256: 98c61591c05d6fb988c1cbcfc7fbd6bb6b39e062a5443db504855bcf12e29483

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # The ubuntu-latest image already ships the Android SDK (ANDROID_HOME is
      # set). android-actions/setup-android@v3 currently fails with
      # "Failed to find package 'tools'", so just assert the SDK is present.
      - name: Verify Android SDK is available
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Set up Python (Chaquopy build host, must match chaquopy.version)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read version from build.gradle
        id: ver
        run: |
          V=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          C=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$C" >> "$GITHUB_OUTPUT"
          echo "versionName=$V versionCode=$C"

      # Guard: a tag must match versionName. A "-ci-test" suffix is allowed so the
      # signed path can be exercised without publishing a release; those runs stop
      # before the upload step.
      - name: Verify tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          V="${{ steps.ver.outputs.version }}"
          BASE="${TAG%-ci-test}"
          if [ "$BASE" != "$V" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $V"
            exit 1
          fi
          if [ "$TAG" != "$BASE" ]; then
            echo "::notice::CI test tag — the APK will be built and verified but NOT published."
          fi

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing secret KEYSTORE_BASE64 (base64 of videodroid.keystore). Cannot build a signed release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > videodroid.keystore
          test -s videodroid.keystore

      - name: Unit tests
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug + release (PR / branch)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
          echo "=== APK sizes ==="
          for f in $(find app/build/outputs/apk -name '*.apk'); do
            SZ=$(stat -c%s "$f")
            MB=$(awk -v s="$SZ" 'BEGIN{printf "%.1f", s/1048576}')
            echo "$f -> $SZ bytes ($MB MB)"
          done

      # Tag builds: the signed release that becomes the release asset.
      # Passwords go in through the environment only (never on the command line,
      # never echoed), and the whole build log is scanned for them afterwards.
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ -z "${RELEASE_STORE_PASSWORD:-}" ] || [ -z "${RELEASE_KEY_PASSWORD:-}" ]; then
            echo "::error::Missing release signing secrets."
            exit 1
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/signing-build.log

      - name: Confirm no signing secret leaked into the build log
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # grep -q prints nothing, so a failure here cannot itself leak the value.
          if grep -qF "$RELEASE_STORE_PASSWORD" /tmp/signing-build.log; then
            echo "::error::The store password appeared in the build log."
            exit 1
          fi
          if grep -qF "$RELEASE_KEY_PASSWORD" /tmp/signing-build.log; then
            echo "::error::The key password appeared in the build log."
            exit 1
          fi
          echo "No signing secret appears in the build log."

      - name: Package + checksum
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          mkdir -p dist
          V="${{ steps.ver.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "dist/VideoDroid-${V}.apk"
          ( cd dist && sha256sum "VideoDroid-${V}.apk" > "VideoDroid-${V}.apk.sha256" )
          ls -la dist
          echo "APK_SHA256=$(awk '{print $1}' "dist/VideoDroid-${V}.apk.sha256")" >> "$GITHUB_ENV"

      # Hard gate: the wrong certificate silently breaks the in-app updater, so a
      # mismatch fails the build instead of being printed and ignored.
      # Hard gate: the wrong certificate silently breaks the in-app updater, so a
      # mismatch fails the build instead of being printed and ignored.
      # Text parsing of `--print-certs` proved brittle across build-tools versions,
      # so this asserts the expected fingerprint is present rather than reformatting it.
      - name: Verify signing certificate fingerprint
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APK="dist/VideoDroid-${{ steps.ver.outputs.version }}.apk"
          CERTS=$("$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK")
          echo "$CERTS"
          if ! printf '%s' "$CERTS" | tr 'A-F' 'a-f' | grep -qF "$EXPECTED_CERT_SHA256"; then
            echo "::error::APK is not signed with $EXPECTED_CERT_SHA256 — the in-app updater would reject it."
            exit 1
          fi
          echo "Certificate matches the release identity ($EXPECTED_CERT_SHA256)."

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: VideoDroid-${{ steps.ver.outputs.version }}
          path: dist/*
          retention-days: 30

  # Publishes only for a real release tag (never for a -ci-test tag).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-ci-test')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The in-app updater reads the checksum from the release body, so the
      # body must always carry a literal "SHA-256: <hex>" line.
      - name: Write release body (checksum contract)
        run: |
          set -euo pipefail
          cd dist
          APK=$(ls *.apk | head -1)
          HASH=$(awk '{print $1}' "${APK}.sha256")
          {
            echo "VideoDroid ${{ github.ref_name }}"
            echo ""
            echo "SHA-256: ${HASH}"
            echo ""
            echo "Asset: \`${APK}\` (+ \`.sha256\`)."
            echo ""
            echo "Full changelog: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)"
          } > release-body.md
          cat release-body.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VideoDroid ${{ github.ref_name }}
          draft: false
          body_path: dist/release-body.md
          files: |
            dist/*.apk
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  screenshots:
    if: "!startsWith(github.ref, 'refs/tags/')"
    # Runner has no /dev/kvm, so the emulator is software-rendered and can
    # throw a system ANR over the app. Experimental: must never block a merge.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python (Chaquopy build host)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assemble debug APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PchaquopyBuildPython="$(which python3)"
          ls -l app/build/outputs/apk/debug/

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Capture each tab on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 4096 -cores 4
          script: bash scripts/capture-screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videodroid-screenshots
          path: screenshots
          if-no-files-found: warn
