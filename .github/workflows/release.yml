name: Build & Release

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Read-only by default; only the release job escalates.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest image already ships the Android SDK (ANDROID_HOME is
      # set). android-actions/setup-android@v3 currently fails with
      # "Failed to find package 'tools'", so just assert the SDK is present.
      - name: Verify Android SDK is available
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Set up Python (Chaquopy build host, must match chaquopy.version)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read version from build.gradle
        id: ver
        run: |
          V=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          C=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$C" >> "$GITHUB_OUTPUT"
          echo "versionName=$V versionCode=$C"

      # Guard: a vX.Y.Z tag must match versionName in the build file.
      - name: Verify tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          V="${{ steps.ver.outputs.version }}"
          if [ "$TAG" != "$V" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $V"
            exit 1
          fi

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing secret KEYSTORE_BASE64 (base64 of videodroid.keystore). Cannot build a signed release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > videodroid.keystore
          test -s videodroid.keystore

      # PR / branch builds: compile check + APK size report. No signing
      # secrets needed — the release APK is built unsigned when no keystore
      # is present, which is what we want for a size comparison.
      - name: Build debug + release (PR / branch)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
          echo "=== APK sizes ==="
          for f in $(find app/build/outputs/apk -name '*.apk'); do
            SZ=$(stat -c%s "$f")
            MB=$(awk -v s="$SZ" 'BEGIN{printf "%.1f", s/1048576}')
            echo "$f -> $SZ bytes ($MB MB)"
          done

      # Tag builds: signed release for the store/release asset.
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Package + checksum
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          mkdir -p dist
          V="${{ steps.ver.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "dist/VideoDroid-${V}.apk"
          ( cd dist && sha256sum "VideoDroid-${V}.apk" > "VideoDroid-${V}.apk.sha256" )
          ls -la dist
          echo "SIZE=$(stat -c%s "dist/VideoDroid-${V}.apk")" >> "$GITHUB_ENV"

      - name: Verify APK is signed
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs \
            "dist/VideoDroid-${{ steps.ver.outputs.version }}.apk" | head -5

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: VideoDroid-${{ steps.ver.outputs.version }}
          path: dist/*
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The in-app updater reads the checksum from the release body, so the
      # body must always carry a literal "SHA-256: <hex>" line.
      - name: Write release body (checksum contract)
        run: |
          set -euo pipefail
          cd dist
          APK=$(ls *.apk | head -1)
          HASH=$(awk '{print $1}' "${APK}.sha256")
          {
            echo "VideoDroid ${{ github.ref_name }}"
            echo ""
            echo "SHA-256: ${HASH}"
            echo ""
            echo "Asset: \`${APK}\` (+ \`.sha256\`)."
            echo ""
            echo "Full changelog: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)"
          } > release-body.md
          cat release-body.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VideoDroid ${{ github.ref_name }}
          draft: false
          body_path: dist/release-body.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
